{% extends "base.html" %}
{% block title %}Generate question user{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
{% endblock %}
{% block body %}
<div class="login-container">
    <h2>Generate question for user</h2>
    <form class="login-form" action="{{url_for('question_toeic.set_generate_question_user')}}" method="post">
        <input type="text" placeholder="Username" name="username" id="username" required>
        <button type="submit">Generate_question</button>
    </form>
</div>
{% endblock %}
